<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Varázserdő Kalandjai</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700&family=Alegreya:ital@0;1&display=swap">
<style>
/* Layout: mesekönyv-lap képernyők; a játéktábla kígyózó ösvény 6 oszlopban, alatta játékoskártyák */
:root{
  --bg:#eef0e2; --paper:#f8f6ec; --ink:#23301f; --muted:#5d6a55;
  --moss:#3f6b35; --moss-ink:#ffffff; --gold:#b98512; --magic:#3a6fb5; --line:#d3d6c1; --taken:#e2e4d4;
  --r1:#e9dfc4; --r2:#f2d3d0; --r3:#ddd8cc; --r4:#d3e5ec; --r5:#e3dcc9; --r6:#efe0b8; --r7:#dce8cf; --r8:#d6d2e4;
  --display:"Alegreya SC",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif; --tale:"Alegreya",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a13; --paper:#1d251b; --ink:#e6e9d8; --muted:#a3ad97;
  --moss:#79a865; --moss-ink:#10170e; --gold:#e3b94a; --magic:#86b3f0; --line:#334030; --taken:#262f24;
  --r1:#3a3424; --r2:#3e2b2a; --r3:#34322c; --r4:#243840; --r5:#36321f; --r6:#3e351c; --r7:#293821; --r8:#2e2b3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a13; --paper:#1d251b; --ink:#e6e9d8; --muted:#a3ad97;
  --moss:#79a865; --moss-ink:#10170e; --gold:#e3b94a; --magic:#86b3f0; --line:#334030; --taken:#262f24;
  --r1:#3a3424; --r2:#3e2b2a; --r3:#34322c; --r4:#243840; --r5:#36321f; --r6:#3e351c; --r7:#293821; --r8:#2e2b3d; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:clamp(10px,3vw,24px);padding-right:clamp(0px,18vw,190px)}
.logo{width:clamp(120px,26vw,240px);height:auto;flex:none;filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--ink) 25%,transparent))}
.htxt{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (max-width:520px){header{flex-direction:column;align-items:flex-start;padding-right:0}.logo{width:150px}}
h1{font-family:var(--display);font-size:clamp(28px,6vw,46px);margin:0;letter-spacing:.02em;color:var(--moss);text-wrap:balance}
.sub{font-family:var(--tale);font-style:italic;color:var(--muted);margin:0}
h2{font-family:var(--display);font-size:clamp(22px,4.5vw,30px);margin:0;text-align:center;text-wrap:balance}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px max(14px,3vw);display:flex;flex-direction:column;gap:18px;align-items:center}
.counts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.count{width:64px;height:64px;border-radius:50%;border:2px solid var(--moss);background:transparent;color:var(--moss);font-family:var(--display);font-size:28px;cursor:pointer}
.count:hover,.count:focus-visible{background:var(--moss);color:var(--moss-ink);outline:none}
.names{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.names input{font:inherit;font-size:18px;text-transform:none;letter-spacing:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.names input:focus-visible{outline:2px solid var(--moss);outline-offset:1px}
.btn{font-family:var(--display);font-size:20px;padding:10px 26px;border-radius:999px;border:none;background:var(--moss);color:var(--moss-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--moss);border:2px solid var(--moss)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.card:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.turn{font-family:var(--tale);font-style:italic;font-size:20px;text-align:center;margin:0}
.turn b{font-family:var(--display);font-style:normal;color:var(--moss)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .15s}
.card:hover:not(:disabled){transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--taken)}
.card .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .n{font-family:var(--display);font-size:18px;line-height:1.15}
.card .d{font-size:13.5px;color:var(--muted);line-height:1.35}
.card:disabled{cursor:default;background:var(--taken)}
.card:disabled img{filter:grayscale(.85) brightness(.8)}
.owner{position:absolute;top:8px;left:8px;right:8px;background:var(--moss);color:var(--moss-ink);font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal .card{animation:deal .5s backwards}
@keyframes deal{from{opacity:.2;transform:translateY(18px) rotate(-4deg)}}
.note{font-family:var(--tale);font-style:italic;color:var(--muted);text-align:center;margin:0;max-width:60ch}

/* Tábla */
.board{position:relative;width:100%;max-width:820px;aspect-ratio:2272/1888;background:#1d2418 url(kepek/tabla.jpg) center/100% 100% no-repeat;border-radius:14px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 25%,transparent)}
.board .tile{position:absolute;aspect-ratio:auto;border:none;background:transparent!important;padding:0;border-radius:9%;overflow:visible}
.board .tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(12,16,10,.68);opacity:1;transition:opacity .5s;pointer-events:none}
.board .tile.occ::before{opacity:0}
.board .tile.here{box-shadow:0 0 0 3px var(--gold),0 0 18px 4px color-mix(in srgb,var(--gold) 60%,transparent)}
.board .tile .num,.board .tile .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tile{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.tile .num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.tile .lab{font-family:var(--display);font-size:clamp(9px,1.9vw,13px);line-height:1.05;overflow-wrap:anywhere}
.tile.goal{border:2px solid var(--gold)}
.tile.start{border:2px solid var(--moss)}
.toks{position:absolute;inset:auto 4% 4% auto;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:1px;max-width:90%}
.tok{width:clamp(22px,5.4vw,44px);height:clamp(22px,5.4vw,44px);border-radius:50%;object-fit:cover;border:2px solid #fff8e6;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.tok.cur{box-shadow:0 0 0 2px var(--gold);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.hud{display:flex;flex-direction:column;align-items:center;gap:10px}
.boardwrap{width:100%;max-width:820px;background:#1d2418;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 28px color-mix(in srgb,var(--ink) 28%,transparent)}
.boardwrap .board{box-shadow:none}
.tray{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:2px 8px 6px}
.tray .turn{color:#e9e4cc;font-size:clamp(15px,2.4vw,20px);text-align:left;min-width:0}
.tray .turn b{color:#e3b94a}
.tray .sig{justify-self:end;width:100%;max-width:230px;height:auto;opacity:.92}
.tray .dice-shadow{background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent)}
@media (max-width:520px){.tray{grid-template-columns:1fr auto}.tray .turn{grid-column:1/-1;text-align:center}.tray .dice-stage{justify-self:start}}
.dice-stage{position:relative;width:120px;height:110px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;perspective:520px;-webkit-tap-highlight-color:transparent}
.dice-stage:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.dice-shadow{position:absolute;bottom:4px;left:50%;width:70px;height:14px;margin-left:-35px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ink) 38%,transparent),transparent);pointer-events:none}
.dice-drop{position:relative;width:64px;height:64px;margin-bottom:12px;transform-style:preserve-3d}
.dice-tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-34deg) rotateY(28deg)}
.dice-stage:hover .dice-tilt{transform:rotateX(-38deg) rotateY(34deg)}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:1px;backface-visibility:hidden;
  background:radial-gradient(circle at 30% 25%,#fffdf5,#f1e9cf 70%,#e2d6b1);box-shadow:inset 0 0 0 1px rgba(80,60,20,.25),inset -4px -5px 10px rgba(120,90,30,.22)}
.face i{border-radius:50%;margin:2px;visibility:hidden;background:radial-gradient(circle at 40% 35%,#4e6b44,#1d2b19 75%)}
.face i.on{visibility:visible}
.face.f1 i.on{background:radial-gradient(circle at 40% 35%,#d34a3c,#7a1f16 75%);margin:0}
.f1{transform:translateZ(32px)}.f6{transform:rotateY(180deg) translateZ(32px)}
.f3{transform:rotateY(90deg) translateZ(32px)}.f4{transform:rotateY(-90deg) translateZ(32px)}
.f2{transform:rotateX(90deg) translateZ(32px)}.f5{transform:rotateX(-90deg) translateZ(32px)}
.cube::before{content:"";position:absolute;inset:4px;background:#e6dcbc;transform:translateZ(0)}
@keyframes roll{0%{transform:rotate(0) scale(.8)}60%{transform:rotate(320deg) scale(1.1)}100%{transform:rotate(360deg) scale(1)}}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.player{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.player.cur{border:2px solid var(--gold)}
.player img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--moss);flex:none}
.player .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.player .pn{font-family:var(--display);font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.player .pc{color:var(--muted);font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-weight:700}
.gold{display:inline-flex;align-items:center;gap:5px;color:var(--gold)}
.magic{display:inline-flex;align-items:center;gap:5px;color:var(--magic)}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,var(--gold) 60%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 70%,#000)}
.spark{width:14px;height:14px;background:var(--magic);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
/* Meserészlet ablak */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.story{background:var(--paper);color:var(--ink);border-radius:16px;border:1px solid var(--line);max-width:560px;width:100%;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;animation:open .3s ease-out}
@keyframes open{from{opacity:0;transform:translateY(14px)}}
.story .place{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.story h3{font-family:var(--display);font-size:24px;margin:0;line-height:1.15}
.story p.txt{font-family:var(--tale);font-size:18px;line-height:1.55;margin:0}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice:hover{border-color:var(--moss)}
.choice .ct{font-weight:700}
.cr{font-size:15px;color:var(--muted);margin:0}
.result{font-family:var(--tale);font-style:italic;font-size:18px;margin:0}
.gain{display:flex;gap:16px;justify-content:center;font-size:20px}
.log{font-family:var(--tale);font-style:italic;color:var(--muted);margin:0;text-align:center;min-height:1.5em}
.podium{display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px}
.sound{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:30;display:flex;gap:6px}
.sound button{font:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.sound button[aria-pressed="true"]{color:var(--moss);border-color:var(--moss)}
.sound button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sound svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.sound .lbl{display:none}}
.hint{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:12px}
.hintbtn{display:inline-flex;align-items:center;gap:8px;font-size:17px;color:var(--magic);border-color:var(--magic)}
.hintbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hintlbl{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:15px;color:var(--muted)}
.hintlbl svg{width:18px;height:18px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hintpay{display:flex;gap:10px;flex-wrap:wrap}
.hintbtn.gold{color:var(--gold);border-color:var(--gold)}
.hinttxt{font-family:var(--tale);font-style:italic;font-size:16px;line-height:1.5;color:var(--muted);margin:0;border-left:3px solid var(--magic);padding-left:10px}
.vault{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 4px;border-top:1px solid var(--line)}
.vaultform{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:420px}
.vaultform label{font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--muted)}
.vaultrow{display:flex;gap:8px;width:100%}
.vaultrow input{flex:1;min-width:0;font:inherit;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.vaultrow input:focus-visible{outline:2px solid var(--moss);outline-offset:1px}
.vaultrow .btn{font-size:17px;padding:6px 18px}
#vaultlist{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px}
.vhead{font-family:var(--display);font-size:20px;text-align:center;margin:0}
.vitem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.vitem .vt{flex:1 1 180px;font-family:var(--display);font-size:17px;min-width:0}
[hidden]{display:none!important}
.vlinks{display:flex;gap:8px;flex-wrap:wrap}
.vitem a{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--moss);border:1px solid var(--moss);border-radius:999px;padding:4px 12px;font-size:14px}
.vitem a.aud{color:var(--magic);border-color:var(--magic)}
.vitem a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.deal .card,.story,.tok.cur{animation:none}.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <img class="logo" src="kepek/ohma-logo.png" alt="Ohma">
    <div class="htxt"><h1>A Varázserdő Kalandjai</h1>
    <p class="sub">társasjáték Ohma meséje nyomán</p></div>
  </header>
  <main id="app"></main>
  <footer class="vault">
    <form id="vaultform" class="vaultform" autocomplete="off">
      <label for="vaultpw">Mesemondó-zug</label>
      <div class="vaultrow">
        <input id="vaultpw" type="password" placeholder="Titkos jelszó" aria-describedby="vaultmsg">
        <button class="btn ghost" id="vaultgo" type="submit">Belépés</button>
      </div>
      <p class="cr" id="vaultmsg" aria-live="polite"></p>
    </form>
    <div id="vaultlist" hidden></div>
  </footer>
</div>
<div id="modal"></div>
<div class="sound" role="group" aria-label="Hangok">
  <button id="sndAmb" aria-pressed="true" title="Erdei háttérhang: madárcsicsergés és szél"><svg viewBox="0 0 24 24"><path d="M3 12c3-4 6-4 9 0s6 4 9 0"/><path d="M3 7c3-3 6-3 9 0"/><path d="M12 17c3 3 6 3 9 0"/></svg><span class="lbl">Erdő</span></button>
  <button id="sndFx" aria-pressed="true" title="Hangeffektek"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg><span class="lbl">Effektek</span></button>
</div>

<script>
const CHARS=[
 {id:"maana",n:"Maana",d:"Kék kezű dinnyemanólány. A düh emeli, a szeretet a legerősebb."},
 {id:"por",n:"Por (Morc)",d:"372 éves beszélő kő. Morcos, de mindent számon tart."},
 {id:"maa",n:"Maa",d:"A mesélő egér. Két betű, meg egy apró szusszanás."},
 {id:"ohma",n:"Ohma",d:"A falu öreg dinnyemanója, a lékelés mestere."},
 {id:"dinne",n:"Dinné",d:"Maana anyja. Harminc tél után is szeret."},
 {id:"neema",n:"Neema",d:"A Kékkezű nagymama a kövimanók völgyéből."},
 {id:"durm",n:"Durm",d:"Szelídített dőrme. Medvemódra halászik, dorombol."},
 {id:"jomag",n:"Jómag",d:"Öreg dőrme, préselt rózsaszirmok őrzője."},
 {id:"tuncsor",n:"Tuncsor",d:"223 éves, unatkozó vizimanó. Az esőről kérdez."},
 {id:"hetedik",n:"Hetedik",d:"Az első egérkatona, aki megtorpant a füttyszóra."},
 {id:"csige",n:"Csige",d:"A csiga, aki elhúzza a reteszt."},
 {id:"grava",n:"A Gráva",d:"Madáristen. Szárnya alatt éj, farkából nap. Mrrrr."},
 {id:"avral",n:"Avrál",d:"A Gráva gőgből született sötét ikre. Rrrrrm."},
 {id:"poka",n:"Pókapóka",d:"Acélhálós, hazug alkuk mestere."},
 {id:"golo",n:"Goloviem",d:"A varázsló, aki elfelejtette önmagát."}
];
const GOLD=100, ROLLCOST=10, BONUS=10;
// Tájak: a mező sorszámtartománya, szín, név
const REGIONS=[
 {k:"falu",n:"OHMA falva",c:"--r7",from:0,to:0},
 {k:"rozsa",n:"A rózsakert",c:"--r2",from:1,to:3},
 {k:"ko",n:"Kőkatlan",c:"--r3",from:4,to:7},
 {k:"viz",n:"Trahandem és Kristálytó",c:"--r4",from:8,to:11},
 {k:"retlak",n:"Rétlak",c:"--r5",from:12,to:15},
 {k:"sivatag",n:"A sivatag",c:"--r6",from:16,to:19},

    // nagy, erdei tér: generált 4,5 mp-es sztereó lecsengés (konvolúciós zengető)
    verb=ctx.createConvolver();verb.buffer=impulse(4.5,2.6);
    const verbOut=ctx.createGain();verbOut.gain.value=1;verb.connect(verbOut).connect(ambBus);
    verbIn=ctx.createGain();verbIn.gain.value=1;
    const pre=ctx.createDelay(.2);pre.delayTime.value=.045;verbIn.connect(pre).connect(verb);
    // a madarak és tücskök nagy része a zengetőbe megy, kevés a száraz jel: messziről szólnak
    birdBus=ctx.createGain();birdBus.gain.value=1;
    const dry=ctx.createGain();dry.gain.value=.35;birdBus.connect(dry).connect(ambBus);
    const wet=ctx.createGain();wet.gain.value=1.1;birdBus.connect(wet).connect(verbIn);
    // az effektekre is jut egy kis tér
    const fxWet=ctx.createGain();fxWet.gain.value=.22;fxBus.connect(fxWet).connect(verbIn);
    return true;
  }
  function impulse(sec,decay){
    const len=ctx.sampleRate*sec,b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);
      for(let i=0;i<len;i++){const t=i/len;
        // korai visszaverődések az első 80 ms-ban (fatörzsek), aztán sűrű, sötétedő lecsengés
        const early=i<ctx.sampleRate*.08&&Math.random()<.004?(Math.random()*2-1)*.9:0;
        d[i]=((Math.random()*2-1)*Math.pow(1-t,decay)*(1-.6*t))+early}}
    return b;
  }
  function noiseBuf(sec,brown){
    const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate),d=b.getChannelData(0);let last=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
    return b;
  }
  // --- szél: barna zaj, lassan hullámzó szűrővel és hangerővel
  function startWind(){
    windSrc=ctx.createBufferSource();windSrc.buffer=noiseBuf(6,true);windSrc.loop=true;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=500;lp.Q.value=.4;
    const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=80;
    windGain=ctx.createGain();windGain.gain.value=.05;
    const lfo=ctx.createOscillator(),lfoG=ctx.createGain();lfo.frequency.value=.07;lfoG.gain.value=220;lfo.connect(lfoG).connect(lp.frequency);lfo.start();
    windSrc.connect(hp).connect(lp).connect(windGain).connect(ambBus);windGain.connect(verbIn);windSrc.start();
    // levélsusogás: halk, magas szűrt zaj
    const rs=ctx.createBufferSource();rs.buffer=noiseBuf(4,false);rs.loop=true;
    const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=5200;bp.Q.value=.7;
    const rg=ctx.createGain();rg.gain.value=.006;
    const l2=ctx.createOscillator(),l2g=ctx.createGain();l2.frequency.value=.13;l2g.gain.value=.004;l2.connect(l2g).connect(rg.gain);l2.start();
    rs.connect(bp).connect(rg).connect(ambBus);rs.start();
    const gust=()=>{const t=ctx.currentTime,g=windGain.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
      g.linearRampToValueAtTime(.06+Math.random()*.06,t+2+Math.random()*2.5);g.linearRampToValueAtTime(.035+Math.random()*.02,t+6+Math.random()*3);
      gustTimer=setTimeout(gust,7000+Math.random()*9000)};
    gustTimer=setTimeout(gust,3000);
  }
  // --- madarak: rövid, csúszó füttyök és trillák, véletlen helyen a térben
  const BIRDS=[
    {f:[3200,4200],n:[3,6],dur:.07,gap:.05,sweep:1.25},   // cinege-szerű trilla
    {f:[2400,2900],n:[2,3],dur:.18,gap:.12,sweep:.82},    // ereszkedő fütty
    {f:[4300,5200],n:[5,9],dur:.035,gap:.03,sweep:1.1},   // gyors csicsergés
    {f:[1800,2200],n:[2,2],dur:.22,gap:.25,sweep:1.35}    // „ki-vit”
  ];
  function chirp(){
    const b=BIRDS[Math.floor(Math.random()*BIRDS.length)];
    const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    const out=ctx.createGain();out.gain.value=.04+Math.random()*.06;
    if(pan){pan.pan.value=Math.random()*1.8-.9;out.connect(pan).connect(birdBus)}else out.connect(birdBus);
    const n=b.n[0]+Math.floor(Math.random()*(b.n[1]-b.n[0]+1));
    const base=b.f[0]+Math.random()*(b.f[1]-b.f[0]);
    let t=ctx.currentTime+.05;
    for(let i=0;i<n;i++){
      const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";
      const f0=base*(1+(Math.random()-.5)*.06);
      o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*b.sweep,t+b.dur);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+b.dur);
      o.connect(g).connect(out);o.start(t);o.stop(t+b.dur+.02);
      t+=b.dur+b.gap;
    }
  }
  // --- tücskök: 3 tücsök, mindegyik a maga hangmagasságán és ritmusában ciripel, távolról
  const CRICKETS=[{f:4400,pan:-.7,rate:32,n:3,every:.62,vol:.018},{f:4950,pan:.55,rate:38,n:4,every:.81,vol:.014},{f:4150,pan:.1,rate:28,n:2,every:.47,vol:.011}];
  let crickNext=[];
  function cricketTick(){
    const now=ctx.currentTime,until=now+1.2;
    CRICKETS.forEach((c,k)=>{
      if(!crickNext[k]||crickNext[k]<now)crickNext[k]=now+.1+Math.random()*.5;
      if(!c.node){c.node=ctx.createGain();c.node.gain.value=c.vol;
        const pn=ctx.createStereoPanner?ctx.createStereoPanner():null;
        if(pn){pn.pan.value=c.pan;c.node.connect(pn).connect(birdBus)}else c.node.connect(birdBus)}
      while(crickNext[k]<until){
        let t=crickNext[k];
        if(Math.random()<.88){                       // néha kihagy egy ciripelést, mint az igazi
          for(let i=0;i<c.n;i++){
            const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=c.f*(1+(Math.random()-.5)*.01);
            const p=1/c.rate;
            g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+p*.25);g.gain.linearRampToValueAtTime(0,t+p*.8);
            o.connect(g).connect(c.node);o.start(t);o.stop(t+p);t+=p}
        }
        crickNext[k]+=c.every*(.92+Math.random()*.16);
      }
    });
    crickTimer=setTimeout(cricketTick,900);
  }
  function birdLoop(){chirp();if(Math.random()<.3)setTimeout(()=>ctx&&amb&&chirp(),400+Math.random()*600);birdTimer=setTimeout(birdLoop,1400+Math.random()*4200)}
  function setAmb(on){
    amb=on;save("vk-amb",on);if(!init())return;ctx.resume&&ctx.resume();
    if(on&&!windSrc)startWind();
    const t=ctx.currentTime;ambBus.gain.cancelScheduledValues(t);ambBus.gain.setValueAtTime(ambBus.gain.value,t);ambBus.gain.linearRampToValueAtTime(on?1:0,t+1.2);
    clearTimeout(birdTimer);clearTimeout(crickTimer);if(on){birdTimer=setTimeout(birdLoop,800);crickTimer=setTimeout(cricketTick,300)}
  }
  function setFx(on){fx=on;save("vk-fx",on);if(ctx)fxBus.gain.value=on?1:0}
  // --- effekt-építőkockák
  function tone(f,t,dur,{type="sine",vol=.3,to=null,attack=.005}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g).connect(fxBus);o.start(t);o.stop(t+dur+.05);
  }
  function knock(t,vol,freq){
    const s=ctx.createBufferSource();s.buffer=noiseBuf(.12,false);
    const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=freq;bp.Q.value=4;
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);
    s.connect(bp).connect(g).connect(fxBus);s.start(t);
    tone(freq*.32,t,.08,{type:"triangle",vol:vol*.5});
  }
  const ready=()=>fx&&init()&&(ctx.resume&&ctx.resume(),true);
  return {
    amb:()=>amb, fx:()=>fx, setAmb, setFx,
    ctx(){if(!init())return null;ctx.resume&&ctx.resume();return ctx},
    duck(on){if(!ctx)return;const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(on?.25:.9,t+.6)},
    wake(){if(init()){ctx.resume&&ctx.resume();if(amb)setAmb(true)}},
    dice(D){if(!ready())return;const t=ctx.currentTime,s=D/1000;
      knock(t+.02,.25,3400);knock(t+.09,.18,2900);                        // kézből elengedve
      [[.42,.9],[.76,.55],[.87,.35]].forEach(([o,v])=>{                  // becsapódások
        knock(t+s*o,v,1500+Math.random()*400);
        for(let k=1;k<4;k++)knock(t+s*o+k*.035+Math.random()*.02,v*.35/k,2400+Math.random()*900)});
      knock(t+s*.97,.15,1900)},
    step(i){if(!ready())return;const t=ctx.currentTime;tone(520+i*40,t,.12,{type:"triangle",vol:.12});tone(1040+i*80,t+.01,.06,{vol:.04})},
    coin(){if(!ready())return;const t=ctx.currentTime;
      [0,.09,.15].forEach((d,k)=>{const f=[2637,3136,2794][k];tone(f,t+d,.35,{vol:.14});tone(f*2.76,t+d,.18,{vol:.05});tone(f*5.4,t+d,.08,{vol:.02})})},
    pay(){if(!ready())return;const t=ctx.currentTime;tone(2349,t,.22,{vol:.08});tone(6480,t,.08,{vol:.02})},
    magic(){if(!ready())return;const t=ctx.currentTime;
      [1047,1319,1568,2093,2637].forEach((f,k)=>{tone(f,t+k*.07,.55,{type:"sine",vol:.11});tone(f*2,t+k*.07+.01,.25,{vol:.03})});
      for(let k=0;k<8;k++)tone(3000+Math.random()*3000,t+.15+Math.random()*.5,.12,{vol:.025})},
    wrong(){if(!ready())return;const t=ctx.currentTime;knock(t,.3,900);tone(392,t+.05,.22,{type:"triangle",vol:.16,to:330});tone(311,t+.25,.35,{type:"triangle",vol:.14,to:233})},
    bonus(){this.magic();if(!ready())return;const t=ctx.currentTime+.4;[784,988,1175,1568].forEach((f,k)=>tone(f,t+k*.06,.3,{type:"triangle",vol:.1}))},
    win(){if(!ready())return;const t=ctx.currentTime;
      [523,659,784,1047,784,1047,1319].forEach((f,k)=>{tone(f,t+k*.12,.6,{type:"triangle",vol:.13});tone(f*2,t+k*.12,.3,{vol:.04})});
      [523,659,784].forEach(f=>tone(f,t+.9,1.6,{type:"sine",vol:.1}));
      for(let k=0;k<16;k++)tone(2500+Math.random()*3500,t+.6+Math.random()*1.4,.15,{vol:.03})}
  };
})();

async function openVault(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(VAULT.s),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(VAULT.i)},key,b64(VAULT.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

// a rajzolt tábla mezőinek helye a képen (%-ban: bal/széles, felső/magas)

    document.getElementById("undo").onclick=()=>{if(S.turn>0){S.turn--;delete S.picks[S.turn];render()}};
    const st=document.getElementById("start");if(st)st.onclick=startGame;
  }
  else if(S.step==="board") renderBoard();
  else if(S.step==="end") renderEnd();
}

function startGame(){

}

function renderBoard(){
  modal.innerHTML="";
  const P=S.players;
  let tiles="";
  for(let i=0;i<=GOAL;i++){
    const r=regionOf(i),{row,col}=tileCell(i);
    const first=i===r.from;
    const here=P.map((p,k)=>p.pos===i?k:-1).filter(k=>k>=0);
    const[cl,cw]=BCOL[col-1],[rt,rh]=BROW[row-1];
    tiles+=`<div class="tile ${here.length?"occ":""} ${here.includes(S.cur)?"here":""}" style="left:${cl}%;top:${rt}%;width:${cw}%;height:${rh}%">
      <span class="num">${i===0?"Start":i===GOAL?"Cél":i}</span>
      <span class="lab">${first||i===GOAL?esc(r.n):""}</span>
      <span class="toks">${here.map(k=>`<img class="tok ${k===S.cur?"cur":""}" src="${img(S.picks[k])}" alt="${esc(S.names[k])}">`).join("")}</span></div>`;
  }

  app.innerHTML=`<section class="panel">
    <h2>${S.round}. kör</h2>
    <div class="boardwrap">
    <div class="board" role="img" aria-label="Játéktábla OHMA falvától Goloviem tornyáig">${tiles}</div>
    <div class="tray">

      ${dieHTML(S.die)}

}

function roll(){
  if(S.phase!=="roll")return;
  S.phase="moving";
  {const p=S.players[S.cur];S.paid=p.gold>=ROLLCOST;if(S.paid){p.gold-=ROLLCOST;SND.pay()}}
  const n=1+Math.floor(Math.random()*6);
  const btn=document.getElementById("roll");btn.disabled=true;
  S.die=n;
  const cube=document.getElementById("cube"),drop=document.getElementById("ddrop"),sh=document.getElementById("dshadow");
  if(reduce||!cube.animate){cube.style.transform=faceT(n);document.getElementById("die").setAttribute("aria-label",`Dobás: ${n}`);setTimeout(()=>move(n),150);return}
  const[fx,fz]=FACE_ROT[n];
  const fy=90*Math.floor(Math.random()*4);              // a felső lap marad felül, csak körbefordul
  const sgn=()=>Math.random()<.5?-1:1;
  const sx=fx+360*(2+Math.floor(Math.random()*2))*sgn();
  const sy=fy+360*(1+Math.floor(Math.random()*2))*sgn();
  const sz=fz+360*sgn();
  S.yaw=fy;
  const D=1500;
  SND.dice(D);
  cube.animate([
    {transform:`rotateY(${sy}deg) rotateX(${sx}deg) rotateZ(${sz}deg)`},
    {transform:`rotateY(${fy+(sy-fy)*.18}deg) rotateX(${fx+(sx-fx)*.18}deg) rotateZ(${fz+(sz-fz)*.12}deg)`,offset:.55},
    {transform:`rotateY(${fy+6}deg) rotateX(${fx-8}deg) rotateZ(${fz-4}deg)`,offset:.8},
    {transform:`rotateY(${fy}deg) rotateX(${fx}deg) rotateZ(${fz}deg)`}
  ],{duration:D,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
  const dk=[
    {transform:"translateY(-190px) scale(.86)",easing:"cubic-bezier(.55,0,1,.45)"},
    {transform:"translateY(0) scale(1.04,.94)",offset:.42,easing:"cubic-bezier(0,.55,.45,1)"},
    {transform:"translateY(-46px) scale(1)",offset:.6,easing:"cubic-bezier(.55,0,1,.45)"},
    {transform:"translateY(0) scale(1.02,.97)",offset:.76,easing:"cubic-bezier(0,.55,.45,1)"},
    {transform:"translateY(-12px)",offset:.87,easing:"cubic-bezier(.55,0,1,.45)"},
    {transform:"translateY(0)"}
  ];
  drop.animate(dk,{duration:D,fill:"forwards"});
  sh.animate([
    {transform:"scale(.3)",opacity:.2},{transform:"scale(1.1)",opacity:1,offset:.42},
    {transform:"scale(.75)",opacity:.6,offset:.6},{transform:"scale(1.05)",opacity:1,offset:.76},
    {transform:"scale(.95)",opacity:.9,offset:.87},{transform:"scale(1)",opacity:1}
  ],{duration:D,fill:"forwards"});
  setTimeout(()=>{document.getElementById("die").setAttribute("aria-label",`Dobás: ${n}`);setTimeout(()=>move(n),350)},D);
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function move(n){
  const p=S.players[S.cur];let left=n;
  const step=()=>{
    if(left===0||p.pos===GOAL){arrive();return}
    p.pos++;left--;SND.step(n-left-1);S.log=`${S.names[S.cur]} ${n}-et dobott ${S.paid?`(−${ROLLCOST} arany)`:"(nem volt elég aranya, ezt a dobást Maa állta)"}.`;renderBoard();
    setTimeout(step,reduce?0:260);
  };
  step();
}

function pickEvent(region){
  const pool=EVENTS[region];if(!pool)return null;
  S.used[region]=S.used[region]||[];
  let free=pool.map((_,i)=>i).filter(i=>!S.used[region].includes(i));
  if(!free.length){S.used[region]=[];free=pool.map((_,i)=>i)}
  const i=free[Math.floor(Math.random()*free.length)];S.used[region].push(i);
  const order=[0,1,2].sort(()=>Math.random()-.5);return {region,idx:i,order};
}

function arrive(){
  const p=S.players[S.cur];
  if(p.pos===GOAL){
    p.done=true;S.finishOrder.push(S.cur);
    S.log=`${S.names[S.cur]} célba ért Goloviem tornyánál!`;
    SND.win();S.step="end";render();return;
  }
  const r=regionOf(p.pos);
  S.event=pickEvent(r.k);S.choice=null;S.phase="event";renderBoard();
}

function rewardHTML(ev){return ev.e?`<span class="magic"><span class="spark" aria-hidden="true"></span>+${ev.e} varázserő</span>`:`<span class="gold"><span class="coin" aria-hidden="true"></span>+${ev.a} arany</span>`}

function hintHTML(){

    <p class="cr">${ok?"Maa felolvassa azt a részt, amiből kiderül a válasz.":`Ehhez ${HINT_COST_GOLD} arany kell, neked most ${p.gold} van.`}</p>

}
function bindHint(){
  const buy=document.getElementById("hintbuy");
  if(buy)buy.onclick=()=>{const p=S.players[S.cur];if(p.gold<HINT_COST_GOLD)return;
    p.gold-=HINT_COST_GOLD;SND.pay();S.log=`${S.names[S.cur]} meghallgatta a súgót (−${HINT_COST_GOLD} arany).`;
    S.event.hinted=true;showEvent();playHint()};
  const again=document.getElementById("hintagain");if(again)again.onclick=playHint;
}
function setHintStat(t){const el=document.getElementById("hintstat");if(el)el.textContent=t}
const chunkUrl=(v,k)=>`hang/mix/k${v}_${String(k).padStart(2,"0")}.mp3`;
function playHint(){
  const h=HINTS[hintKey()];if(!h)return;
  const[v,s,e]=h,len=e-s,total=len+HINT_FADE,k=Math.floor(s/CHUNK),off=s-k*CHUNK;
  stopHint(true);
  const ctx=SND.ctx();
  // a lejátszandó szakasz darabjai (ha a rész két 10 perces darab határára esik, kettő)
  const parts=[{k,off,dur:Math.min(total,CHUNK-off)}];
  if(total>CHUNK-off)parts.push({k:k+1,off:0,dur:total-(CHUNK-off)});
  if(ctx){hintGain=ctx.createGain();hintGain.gain.value=0;hintGain.connect(ctx.destination)}
  hintEls=parts.map(pt=>{const a=new Audio(chunkUrl(v,pt.k));a.preload="auto";
    if(ctx){try{const n=ctx.createMediaElementSource(a);n.connect(hintGain);hintNodes.push(n)}catch(err){}}return a});
  setHintStat("Betöltöm a hangjátékot…");SND.duck(true);
  const first=hintEls[0];
  first.addEventListener("loadedmetadata",()=>{
    first.currentTime=parts[0].off;
    first.play().then(()=>{
      setHintStat(`Maa mesél a ${v}. kötetből…`);
      // halkítás: Web Audio (iPhone-on az audio.volume nem állítható); tartalék: volume
      if(hintGain){const t=ctx.currentTime;hintGain.gain.setValueAtTime(0,t);hintGain.gain.linearRampToValueAtTime(1,t+.3);
        hintGain.gain.setValueAtTime(1,t+len);hintGain.gain.linearRampToValueAtTime(0,t+total)}
      else{const t0=performance.now();hintTimers.push(setInterval(()=>{const el=(performance.now()-t0)/1000;
        hintEls.forEach(a=>a.volume=el>len?Math.max(0,1-(el-len)/HINT_FADE):1)},80))}
      if(hintEls[1]){hintEls[1].load();hintTimers.push(setTimeout(()=>{first.pause();hintEls[1].currentTime=0;hintEls[1].play().catch(()=>{})},parts[0].dur*1000))}
      hintTimers.push(setTimeout(()=>stopHint(),(total+.15)*1000));
    }).catch(()=>{setHintStat("A lejátszás nem indult el. Koppints újra a gombra.");SND.duck(false)});
  },{once:true});
  first.onerror=()=>{setHintStat("Ezt a részt most nem sikerült betölteni.");SND.duck(false)};
}
function stopHint(keep){
  hintTimers.forEach(t=>{clearTimeout(t);clearInterval(t)});hintTimers=[];
  hintEls.forEach(a=>{try{a.pause();a.removeAttribute("src");a.load()}catch(e){}});
  try{hintNodes.forEach(n=>n.disconnect());hintGain&&hintGain.disconnect()}catch(e){}
  hintEls=[];hintNodes=[];hintGain=null;
  if(!keep){SND.duck(false);setHintStat("")}
}

function showEvent(){
  const ev=EVENTS[S.event.region][S.event.idx];
  const r=REGIONS.find(x=>x.k===S.event.region);
  const name=S.names[S.cur];
  const head=`<p class="place">${esc(r.n)} · ${esc(name)}</p>`;
  if(S.choice===null){
    modal.innerHTML=`<div class="veil"><div class="story" role="dialog" aria-modal="true" aria-labelledby="evt">
      ${head}<h3 id="evt">${esc(ev.q)}</h3>
      <p class="cr">Jó válaszért jutalom: <span class="gain" style="display:inline-flex;font-size:17px">${rewardHTML(ev)}</span></p>
      <div class="choices">${S.event.order.map((oi,n)=>`<button class="choice" data-i="${oi}"><span class="ct">${"ABC"[n]}) ${esc(ev.o[oi])}</span></button>`).join("")}</div>
      ${hintHTML()}
    </div></div>`;
    modal.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
    bindHint();
    modal.querySelector(".choice").focus();
  } else {
    const ok=S.choice===0;
    modal.innerHTML=`<div class="veil"><div class="story" role="dialog" aria-modal="true" aria-labelledby="evt">
      ${head}<h3 id="evt">${ok?"Helyes!":"Nem talált."}</h3>
      <p class="result">${ok?"":`A helyes válasz: <b>${esc(ev.o[0])}</b>. `}${esc(ev.x||"")}</p>
      <div class="gain">${ok?rewardHTML(ev):`<span class="cr">Most nincs jutalom.</span>`}</div>
      <div class="row"><button class="btn" id="next">Tovább</button></div>
    </div></div>`;
    const nx=document.getElementById("next");nx.onclick=nextTurn;nx.focus();
  }
}

function choose(i){
  stopHint();
  const ev=EVENTS[S.event.region][S.event.idx],p=S.players[S.cur];
  S.choice=i;
  if(i===0){ev.e?SND.magic():SND.coin();p.magic+=ev.e||0;p.gold+=ev.a||0;S.log=`${S.names[S.cur]} jól válaszolt: ${ev.e?`+${ev.e} varázserő`:`+${ev.a} arany`}.`}
  else{SND.wrong();S.log=`${S.names[S.cur]} most nem talált.`}
  showEvent();
}

function nextTurn(){
  S.event=null;S.choice=null;S.phase="roll";
  const cp=S.players[S.cur];
  if(!cp.done&&cp.magic>=BONUS){cp.magic-=BONUS;SND.bonus();S.log=`${S.names[S.cur]} összegyűjtött ${BONUS} varázserőt: még egyet dobhat!`;renderBoard();return}
  const n=S.players.length;let k=S.cur;
  do{k=(k+1)%n;if(k===0)S.round++}while(S.players[k].done&&S.players.some(p=>!p.done));
  S.cur=k;renderBoard();
}

function renderEnd(){
  const w=S.finishOrder[0],P=S.players;
  const order=P.map((p,i)=>i).sort((a,b)=>(P[b].pos-P[a].pos)||(P[b].magic-P[a].magic)||(P[b].gold-P[a].gold));
  app.innerHTML=`<section class="panel">
    <h2>${esc(S.names[w])} célba ért!</h2>
    <p class="note">${esc(charOf(w).n)} elsőként érkezett Goloviem tornyához, a ${S.round}. körben. A torony kapuja kinyílt.</p>
    <img src="${img(S.picks[w])}" alt="${esc(charOf(w).n)}" style="width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)">
    <div class="podium">${order.map((i,rank)=>`<div class="player ${i===w?"cur":""}"><img src="${img(S.picks[i])}" alt="${esc(charOf(i).n)}"><div class="t">
      <span class="pn">${rank+1}. ${esc(S.names[i])}</span><span class="pc">${esc(charOf(i).n)} · ${P[i].pos===GOAL?"célban":P[i].pos+". mező"}</span>
      <span class="stats"><span class="gold"><span class="coin" aria-hidden="true"></span>${P[i].gold}</span><span class="magic"><span class="spark" aria-hidden="true"></span>${P[i].magic} varázserő</span></span></div></div>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="again">Új játék</button><button class="btn" id="rematch">Visszavágó</button></div>
  </section>`;
  document.getElementById("again").onclick=()=>{S={step:"count",count:0,names:[],picks:{},turn:0};render()};
  document.getElementById("rematch").onclick=startGame;
}

function start(d){if(d&&d.step)S=d;if(S.phase==="moving")S.phase="roll";render()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body></html>
